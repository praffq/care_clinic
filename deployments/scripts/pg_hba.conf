# Client authentication for the clinic database. Same rules the official image
# writes, plus password-protected replication so the backup sidecar can take
# full copies with pg_basebackup. The database has no published port; only
# containers on the clinic's private network can reach it.
local     all          all                    trust
host      all          all   127.0.0.1/32     trust
host      all          all   ::1/128          trust
local     replication  all                    trust
host      replication  all   127.0.0.1/32     trust
host      replication  all   ::1/128          trust
host      all          all   all              scram-sha-256
host      replication  all   all              scram-sha-256
