# The CARE stack. It runs inside the engine VM as compose project "care":
# the host uploads this file as compose.yml, together with backend.env,
# Caddyfile, minio-entrypoint.sh, setup.html and the generated stack.env
# (interpolation: digest-pinned images, host name), clinic.env (served
# origins) and secrets.env (generated once). See app/internal/stack.
name: care

networks:
  default:
    # Pinned so Caddy can accept PROXY headers only from the gateway, which is
    # where the engine's port relay connects from (via docker's port proxy).
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:

x-backend: &backend
  image: ${IMAGE_BACKEND:?IMAGE_BACKEND not set}
  pull_policy: never
  restart: unless-stopped
  env_file: [./backend.env, ./clinic.env, ./secrets.env]

services:
  db:
    image: ${IMAGE_POSTGRES:?IMAGE_POSTGRES not set}
    pull_policy: never
    restart: unless-stopped
    env_file: [./backend.env, ./secrets.env]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 10s

  redis:
    image: ${IMAGE_REDIS:?IMAGE_REDIS not set}
    pull_policy: never
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  minio:
    image: ${IMAGE_SILO:?IMAGE_SILO not set}
    pull_policy: never
    restart: unless-stopped
    env_file: [./backend.env, ./secrets.env]
    labels:
      care.config: ${MINIO_CONFIG_SHA:-}
    volumes:
      - minio-data:/data
      - ./minio-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # No published port: browsers reach files through Caddy (/patient-bucket,
    # /facility-bucket), same-origin with the app.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      retries: 5

  # One-shot: schema migrations and CARE's sync commands. Only migrations.run
  # starts it (profile), so booting or restarting the stack never migrates.
  migrate:
    <<: *backend
    profiles: [migrate]
    restart: "no"
    entrypoint:
      - bash
      - -c
      - ./wait_for_db.sh && ./wait_for_redis.sh &&
        python manage.py migrate --noinput &&
        python manage.py sync_permissions_roles &&
        python manage.py sync_valueset
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  backend:
    <<: *backend
    entrypoint: ["bash", "start.sh"]
    depends_on: &after-migrate
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully, required: false}

  celery-worker:
    <<: *backend
    entrypoint: ["bash", "celery_worker.sh"]
    depends_on: *after-migrate

  # Not celery_beat.sh: upstream runs migrations there on every start.
  celery-beat:
    <<: *backend
    entrypoint:
      - bash
      - -c
      - printf celery-beat > /tmp/container-role &&
        ./wait_for_db.sh && ./wait_for_redis.sh && touch /tmp/healthy &&
        exec celery --app=config.celery_app beat --loglevel=info
    depends_on: *after-migrate

  frontend:
    image: ${IMAGE_FRONTEND:?IMAGE_FRONTEND not set}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: ${IMAGE_CADDY:?IMAGE_CADDY not set}
    pull_policy: never
    restart: unless-stopped
    env_file: [./backend.env]
    environment:
      CARE_HOST: ${CARE_HOST:?CARE_HOST not set}
    labels:
      care.config: ${CADDY_CONFIG_SHA:-}
    command:
      - /bin/sh
      - -c
      - printf 'SecRuleEngine %s\n' "$${CORAZA_MODE:-Off}" > /etc/caddy/waf-mode.conf &&
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    # Guest loopback only: the engine relays the host's forwarded ports here.
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8480:8480"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./setup.html:/setup/index.html:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
      - minio
