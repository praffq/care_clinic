# CARE frontend for CARE Clinic: care_fe's nginx/nginx.conf without HSTS (the
# clinic uses a local CA), plus plain static serving of plugin remotes.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;

  include mime.types;
  types {
    text/javascript js mjs;
  }

  location = /index.html {
    expires 6h;
  }

  # Plugin remotes (/plugins/<slug>/assets/remoteEntry.js): plain files, no
  # SPA fallback, so a missing remote is a 404 rather than index.html.
  # remoteEntry.js keeps its name across builds: always revalidate.
  location /plugins/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    expires 7d;
    try_files $uri $uri/ /index.html;
  }
}
