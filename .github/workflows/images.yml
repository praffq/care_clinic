name: Images

# Builds the images CARE Clinic owns (care-backend and care-frontend with the
# versions.yml plugins, their builder images, care-caddy, care-backup) for
# linux/amd64 and linux/arm64 on native runners with the same definitions as
# local dev (scripts/dev-images.sh --push), smoke-tests the backend with every
# plugin enabled, pushes them to ghcr.io/<this repo>/<name>, and uploads their
# digests as the "images" artifact (images.json is the care + support_images
# part of a `release generate` artifacts file). The backend, frontend and
# plugin refs are resolved to commits once, in the plan job, and recorded in
# images.json. Also called by track.yml. See docs/ci-publishing.md.
on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Ref overrides, space-separated NAME=REF (NAME: backend, frontend or a plugin id)"
        type: string
        default: ""
      demo:
        description: Also build the demo-only backend images (care-backend-demo-b, care-backend-demo-c-broken)
        type: boolean
        default: false
  workflow_call:
    inputs:
      sources:
        description: Resolved commits to build (scripts/dev-images.sh --print-sources JSON); default resolves the refs
        type: string
        default: ""
      refs:
        description: Ref overrides, space-separated NAME=REF
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - versions.yml
      - scripts/dev-images.sh
      - deployments/.env
      - deployments/caddy.Dockerfile
      - deployments/backup.Dockerfile
      - deployments/frontend.Dockerfile
      - deployments/frontend-nginx.conf
      - deployments/care-build-remote.sh
      - deployments/frontend.env
      - scripts/smoke-backend.sh
      - demo/images/**
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prefix: ${{ steps.plan.outputs.prefix }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the backend, frontend and plugin refs
        id: sources
        env:
          SOURCES: ${{ inputs.sources || '' }}
          REFS: ${{ inputs.refs || '' }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCES" ]; then
            printf '%s' "$SOURCES" >sources.json
            args=(--sources sources.json)
          else
            args=()
            for r in $REFS; do args+=(--ref "$r"); done
          fi
          scripts/dev-images.sh --print-sources ${args[@]+"${args[@]}"} >resolved.json
          echo "sources=$(jq -c . resolved.json)" >>"$GITHUB_OUTPUT"
          {
            echo "### Sources"
            echo
            echo "| Name | Repository | Ref | Commit |"
            echo "| --- | --- | --- | --- |"
            jq -r '({backend, frontend} | to_entries[]), (.plugins | to_entries[])
              | "| \(.key) | \(.value.repo) | \(.value.ref) | `\(.value.rev)` |"' resolved.json
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Choose registry prefix, tag and build matrix
        id: plan
        env:
          DEMO: ${{ inputs.demo || false }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Unique per run: track.yml rebuilds the same commit of this repo.
          tag="sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          # The builders share their job (and its build cache) with their image.
          jobs='[{"only":"care-backend-A --only care-backend-builder"},{"only":"care-frontend-A --only care-frontend-builder"},{"only":"care-caddy"},{"only":"care-backup"}]'
          if [ "$DEMO" = true ]; then
            jobs=$(jq -c '. + [{"only":"care-backend-B --only care-backend-C-broken"}]' <<<"$jobs")
          fi
          arches='[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]'
          matrix=$(jq -nc --argjson j "$jobs" --argjson a "$arches" '{include: [$j[] as $x | $a[] as $y | $x + $y]}')
          {
            echo "prefix=$prefix"
            echo "tag=$tag"
            echo "matrix=$matrix"
          } >>"$GITHUB_OUTPUT"
          echo "Pushing $prefix/<name>:$tag"
          jq . <<<"$matrix"

  build:
    name: Build ${{ matrix.only }} (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          PREFIX: ${{ needs.plan.outputs.prefix }}
          TAG: ${{ needs.plan.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          ONLY: ${{ matrix.only }}
          SOURCES: ${{ needs.plan.outputs.sources }}
        run: |
          printf '%s' "$SOURCES" >"$RUNNER_TEMP/sources.json"
          # ONLY may hold several "--only" values.
          # shellcheck disable=SC2086
          scripts/dev-images.sh --push "$PREFIX" --tag "$TAG" --arch "$ARCH" \
            --sources "$RUNNER_TEMP/sources.json" --only $ONLY
      - name: Name the digest artifact
        id: name
        env:
          ONLY: ${{ matrix.only }}
          ARCH: ${{ matrix.arch }}
        run: echo "name=push-${ONLY%% *}-$ARCH" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/images/push/*.json
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke-test care-backend (plugins enabled)
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: manage.py check and migrate against a throwaway postgres
        env:
          IMAGE: ${{ needs.plan.outputs.prefix }}/care-backend:${{ needs.plan.outputs.tag }}-amd64
        run: |
          docker pull -q "$IMAGE"
          scripts/smoke-backend.sh "$IMAGE"

  merge:
    name: Publish multi-arch images
    needs: [plan, build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: push-*
          path: push
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch indexes and write images.json
        env:
          PREFIX: ${{ needs.plan.outputs.prefix }}
          TAG: ${{ needs.plan.outputs.tag }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          pin() { awk -v s="$1" -v k="$2" '
            /^[^ #]/ { sec = $0; sub(/:.*/, "", sec); next }
            sec == s && $0 ~ "^  " k ":" { sub(/^[^:]*:[ ]*/, ""); sub(/[ ]+#.*$/, ""); gsub(/"/, ""); print; exit }' versions.yml; }
          index_digest() {
            local d
            d=$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest)
            grep -Eqx 'sha256:[0-9a-f]{64}' <<<"$d" || { echo "::error::no index digest for $1" >&2; return 1; }
            echo "$d"
          }

          mkdir -p out
          echo '{}' >out/indexes.json
          for repo in $(jq -r '.repo' push/*.json | sort -u); do
            ref="$PREFIX/$repo"
            mapfile -t sources < <(jq -r --arg r "$repo" 'select(.repo == $r) | .ref + "@" + .digest' push/*.json)
            arches=$(jq -r --arg r "$repo" 'select(.repo == $r) | .arch' push/*.json | sort | xargs)
            if [ "$arches" != "amd64 arm64" ]; then
              echo "::error::$repo was built for [$arches], want amd64 and arm64"
              exit 1
            fi
            tags=(-t "$ref:$TAG")
            if [ "$ON_MAIN" = true ]; then tags+=(-t "$ref:main"); fi
            docker buildx imagetools create "${tags[@]}" \
              --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              "${sources[@]}"
            digest=$(index_digest "$ref:$TAG")
            revision=$(jq -r --arg r "$repo" 'select(.repo == $r) | .revision' push/*.json | sort -u | head -n 1)
            jq --arg repo "$repo" --arg ref "$ref" --arg tag "$TAG" --arg digest "$digest" --arg rev "$revision" \
              --slurpfile per <(jq -c --arg r "$repo" 'select(.repo == $r) | {(.arch): .digest}' push/*.json) \
              '.[$repo] = {ref: $ref, tag: $tag, digest: $digest, revision: $rev, platforms: ($per | add)}' \
              out/indexes.json >out/tmp.json && mv out/tmp.json out/indexes.json
            echo "$ref:$TAG -> $digest"
          done

          # Support images are pulled, not built: record their index digests.
          echo '{}' >out/support.json
          for role in postgres redis silo; do
            image=$(pin images "$role")
            digest=$(index_digest "$image")
            jq --arg role "$role" --arg ref "$image" --arg digest "$digest" \
              '.[$role] = {ref: $ref, digest: $digest}' out/support.json >out/tmp.json && mv out/tmp.json out/support.json
            echo "$image -> $digest"
          done

          # Every image was built from the plan job's sources.
          jq -c 'select(.sources != null) | .sources' push/*.json | sort -u >out/sources.jsonl
          [ "$(wc -l <out/sources.jsonl)" -eq 1 ] || { echo "::error::images disagree on sources"; cat out/sources.jsonl; exit 1; }

          # images.json: the care + support_images sections of a `release
          # generate` artifacts file (docs/updates-feed.md).
          jq -n --slurpfile i out/indexes.json --slurpfile s out/support.json --slurpfile src out/sources.jsonl \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            ($i[0]) as $i | ($s[0]) as $s | ($src[0]) as $src |
            def img($r): {ref: $i[$r].ref, digest: $i[$r].digest};
            ( if ($i | has("care-backend") and has("care-frontend") and has("care-caddy") and has("care-backup")
                     and has("care-backend-builder") and has("care-frontend-builder")) then
                {care: {
                  backend_rev: $src.backend.rev[0:12],
                  frontend_rev: $src.frontend.rev[0:12],
                  released_at: $released_at,
                  migrations: true,
                  images: {backend: img("care-backend"), frontend: img("care-frontend"),
                           caddy: img("care-caddy"), backup: img("care-backup")},
                  builders: {"backend-builder": img("care-backend-builder"),
                             "frontend-builder": img("care-frontend-builder")},
                  sources: $src}}
              else {} end )
            + {support_images: $s}' >out/images.json
          # images-meta.json: everything, including demo images and per-arch digests.
          jq -n --slurpfile i out/indexes.json --slurpfile s out/support.json \
            --arg sha "$GITHUB_SHA" --arg tag "$TAG" --arg run "$GITHUB_RUN_ID" \
            '{commit: $sha, tag: $tag, run_id: $run, images: $i[0], support_images: $s[0]}' >out/images-meta.json
          rm out/indexes.json out/support.json out/sources.jsonl
          jq . out/images.json
      - name: Summarize
        run: |
          {
            echo "### Images"
            echo
            echo "| Image | Digest | amd64 | arm64 |"
            echo "| --- | --- | --- | --- |"
            jq -r '.images | to_entries[] | "| `\(.value.ref):\(.value.tag)` | `\(.value.digest)` | `\(.value.platforms.amd64)` | `\(.value.platforms.arm64)` |"' out/images-meta.json
            jq -r '.support_images | to_entries[] | "| `\(.value.ref)` | `\(.value.digest)` | | |"' out/images-meta.json
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: out/
          if-no-files-found: error
          retention-days: 90
