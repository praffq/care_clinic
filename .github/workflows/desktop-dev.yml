name: Desktop dev prerelease (UNSIGNED)

# Manually builds an UNSIGNED Windows installer from main and attaches it to a
# GitHub prerelease under a dev-only tag (desktop-dev-vX.Y.Z-dev.N). It never
# signs, never loads signing secrets or the signing environment, never
# creates the stable vX.Y.Z tag, and never touches Pages or updates.json, so the
# desktop updater never offers this build.
on:
  workflow_dispatch:
    inputs:
      acknowledge_unsigned:
        description: I understand this publishes an UNSIGNED dev installer that is not for clinics
        type: boolean
        default: false

permissions: {}

concurrency:
  group: desktop-dev-prerelease
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Check dispatch and resolve dev tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dev_version: ${{ steps.tag.outputs.dev_version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Require an acknowledged manual run from main
        env:
          ACK: ${{ inputs.acknowledge_unsigned }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "::error::Dev prereleases are only created by manual dispatch."; exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Dev prereleases are only built from main (got $GITHUB_REF)."; exit 1
          fi
          if [ "$GITHUB_REPOSITORY" = ohcnetwork/care_clinic ]; then
            echo "::error::Unsigned dev prereleases are not published from the upstream repository."; exit 1
          fi
          if [ "$ACK" != true ]; then
            echo "::error::Set acknowledge_unsigned to confirm an UNSIGNED dev prerelease."; exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve collision-safe dev tag
        id: tag
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("versions.toml", "rb"))["desktop"]["version"])')
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::versions.toml desktop.version must be X.Y.Z, got '$version'"; exit 1
          fi
          dev_version="$version-dev.$GITHUB_RUN_NUMBER"
          tag="desktop-dev-v$dev_version"
          # Dev tags can never equal a stable vX.Y.Z or care-engine-vX.Y.Z tag.
          if ! [[ "$tag" =~ ^desktop-dev-v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            echo "::error::Unexpected dev tag '$tag'"; exit 1
          fi
          {
            echo "version=$version"
            echo "dev_version=$dev_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Dev prerelease tag: $tag"

  frontend:
    name: Frontend
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Check bindings, typecheck, and build frontend
        working-directory: app/frontend
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-dev-frontend
          path: app/frontend/dist/
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build unsigned Windows installer
    needs: [guard, frontend]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Fetch built desktop frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-dev-frontend
          path: app/frontend/dist
      - name: Install Windows installer tooling
        uses: ./.github/actions/install-nsis
      - name: Install matching Wails CLI
        working-directory: app
        run: go install github.com/wailsapp/wails/v2/cmd/wails@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - name: Prepare installer metadata and deployment kit
        run: node app/frontend/scripts/stage-install.mjs
      - name: Vet on the native desktop host
        working-directory: app
        run: go vet ./...
      - name: Build native application
        working-directory: app
        run: wails build -platform windows/amd64 -clean -s -skipbindings -m -nosyncgomod -nsis
      - name: Collect unsigned installer
        env:
          DEV_VERSION: ${{ needs.guard.outputs.dev_version }}
          BUILD_DIR: app/build/bin
        run: |
          test -s "$BUILD_DIR/CARE Clinic.exe"
          installers=("$BUILD_DIR"/*installer.exe)
          test "${#installers[@]}" -eq 1 && test -s "${installers[0]}"
          mkdir -p dev-release
          cp "${installers[0]}" "dev-release/CARE-Clinic-$DEV_VERSION-UNSIGNED-windows-amd64-setup.exe"
          git diff --exit-code -- app/go.mod app/go.sum
      - name: Verify metadata and that the installer is truthfully unsigned
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          foreach ($file in @("app/build/bin/CARE Clinic.exe") + (Get-ChildItem dev-release/*.exe).FullName) {
            $info = (Get-Item $file).VersionInfo
            "${file}: product='$($info.ProductName)' company='$($info.CompanyName)' version='$($info.ProductVersion)'"
            if ($info.ProductName -ne 'CARE Clinic' -or $info.CompanyName -ne 'Open Healthcare Network Foundation' -or $info.ProductVersion -ne $env:VERSION) {
              throw "Version metadata does not match versions.toml"
            }
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'NotSigned') { throw "$file is expected to be unsigned, got $($signature.Status)" }
          }
      - name: Write SHA256SUMS
        shell: pwsh
        working-directory: dev-release
        run: |
          $lines = Get-ChildItem *.exe | Sort-Object Name | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::WriteAllText((Join-Path $PWD SHA256SUMS), (($lines -join "`n") + "`n"))
          Get-Content SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-dev-windows-unsigned
          path: dev-release/
          if-no-files-found: error
          retention-days: 7

  prerelease:
    name: Create UNSIGNED dev prerelease
    needs: [guard, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-dev-windows-unsigned
          path: dev-release
      - name: Verify assets
        working-directory: dev-release
        run: |
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Create prerelease without replacing anything
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          DEV_VERSION: ${{ needs.guard.outputs.dev_version }}
        run: |
          [[ "$TAG" =~ ^desktop-dev-v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1 \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$TAG already exists; dispatch a new run instead of replacing it."; exit 1
          fi
          cat > notes.md <<EOF
          > [!WARNING]
          > **UNSIGNED DEVELOPMENT BUILD — not for clinic use.**
          > The Windows installer is not Authenticode-signed, so Windows SmartScreen will warn
          > before running it. It is not listed in the signed \`updates.json\` feed and the
          > desktop updater will never offer it. Stable releases use \`vX.Y.Z\` tags.

          - Dev version: \`$DEV_VERSION\` (embedded application version is the \`versions.toml\` pin)
          - Source commit: \`$GITHUB_SHA\` on \`main\`
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Verify the download with \`SHA256SUMS\` before running it.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "UNSIGNED dev build $DEV_VERSION (Windows)" \
            --notes-file notes.md dev-release/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
