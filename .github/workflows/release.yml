name: Release CARE Clinic

# Builds the desktop installers for versions.yml desktop.version and drafts
# the GitHub Release desktop-v<version>. Signing uses the same secrets and
# variables as ohcnetwork/care_clinic; each platform whose signing is not
# configured ships unsigned (macOS ad-hoc) with a warning. See docs/releases.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [versions.yml]

permissions:
  contents: read

concurrency:
  group: care-clinic-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Compare desktop.version with the previous commit
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version_at() {
            gh api "repos/$GITHUB_REPOSITORY/contents/versions.yml?ref=$1" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null \
              | awk '/^desktop:/ { in_desktop = 1; next } /^[^ #]/ { in_desktop = 0 }
                     in_desktop && /^  version:/ { gsub(/["\r ]/, "", $2); print $2; exit }'
          }
          now=$(version_at "$GITHUB_SHA")
          before=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            before=$(version_at "$BEFORE")
          fi
          if [ -n "$now" ] && [ "$now" != "$before" ]; then
            echo "desktop.version changed from ${before:-(none)} to $now; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop.version is unchanged ($now); nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Validate release configuration
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      engine_tag: ${{ steps.version.outputs.engine_tag }}
      sign_windows: ${{ steps.signpath.outputs.sign_windows }}
      windows_signing: ${{ steps.signpath.outputs.windows_signing }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Read the desktop and engine versions
        id: version
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pins = fs.readFileSync("versions.yml", "utf8");
          const value = section => {
            const block = pins.match(new RegExp(`^${section}:[^\\S\\r\\n]*\\r?\\n((?:(?:[ \\t]+[^\\r\\n]*|[ \\t]*)\\r?\\n)*)`, "m"));
            const matches = block ? [...block[1].matchAll(/^  version:[ \t]*"?([^"\s#]*)"?[ \t]*(?:#.*)?$/gm)] : [];
            if (matches.length !== 1) throw new Error(`Expected one ${section}.version in versions.yml`);
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(matches[0][1])) {
              throw new Error(`Releases require ${section}.version X.Y.Z (no -dev suffix) in versions.yml`);
            }
            return matches[0][1];
          };
          const version = value("desktop");
          const engine = value("engine");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nengine_tag=engine-v${engine}\n`);
          NODE
      - name: Reject an existing release version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"desktop-v$VERSION\") | .html_url")
          if [ -n "$existing" ]; then
            echo "::error::Desktop $VERSION already has a release: $existing. Bump desktop.version in versions.yml; published assets are never replaced."
            exit 1
          fi
      - name: Require the engine release
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_TAG: ${{ steps.version.outputs.engine_tag }}
        run: |
          version=${ENGINE_TAG#engine-v}
          assets=$(gh release view "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name') || {
            echo "::error::Engine release $ENGINE_TAG (versions.yml engine.version) does not exist. Release the engine first (engine.yml)."
            exit 1
          }
          for asset in "care-engine-$version-arm64.tar.gz" SHA256SUMS; do
            if ! grep -qxF "$asset" <<<"$assets"; then
              echo "::error::Engine release $ENGINE_TAG has no $asset."
              exit 1
            fi
          done
      - name: Read SignPath configuration
        id: signpath
        env:
          TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          configured=()
          if [ "$TOKEN_SET" = "true" ]; then configured+=(SIGNPATH_API_TOKEN); fi
          if [ -n "$ORGANIZATION_ID" ]; then configured+=(SIGNPATH_ORGANIZATION_ID); fi
          if [ -n "$PROJECT_SLUG" ]; then configured+=(SIGNPATH_PROJECT_SLUG); fi
          if [ -n "$POLICY_SLUG" ]; then configured+=(SIGNPATH_SIGNING_POLICY_SLUG); fi
          case "${#configured[@]}" in
            0)
              echo "::warning::SignPath is not configured; the Windows installer will be unsigned."
              echo "sign_windows=false" >> "$GITHUB_OUTPUT"
              echo "windows_signing=unsigned" >> "$GITHUB_OUTPUT" ;;
            4)
              echo "sign_windows=true" >> "$GITHUB_OUTPUT"
              if [ "$POLICY_SLUG" = "test-signing" ]; then
                echo "::warning::SignPath policy test-signing uses an untrusted test certificate; do not publish this release."
                echo "windows_signing=signpath-test" >> "$GITHUB_OUTPUT"
              else
                echo "windows_signing=signpath-foundation" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "::error::SignPath is partly configured (${configured[*]}). Set the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG variables, or none of them."
              exit 1 ;;
          esac

  checks:
    name: Check and build selected commit
    needs: [prepare]
    uses: ./.github/workflows/ci.yml
    with:
      engine-tag: ${{ needs.prepare.outputs.engine_tag }}

  # SignPath signs PE files but cannot open an NSIS installer, so the application
  # and uninstaller are signed first and the installer is rebuilt around the signed
  # files and signed in turn. Every signing request refers to an artifact uploaded by this run.
  sign-windows-app:
    name: Sign Windows application
    needs: [prepare, checks]
    if: needs.prepare.outputs.sign_windows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find the CI-built application artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "desktop-windows-app" and .expired == false)]
                  | if length == 1 then .[0].id else error("expected one desktop-windows-app artifact, found \(length)") end')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Submit to SignPath and wait for approval
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artifact.outputs.id }}
          parameters: |
            version: "${{ needs.prepare.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: signed-app
      - run: test -s "signed-app/CARE Clinic.exe" && test -s signed-app/uninstall.exe
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-windows-app-signed
          path: signed-app/
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Build installer around the signed application
    needs: [prepare, sign-windows-app]
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: desktop-windows-app-signed
          path: signed-app
      - uses: actions/download-artifact@v8.0.1
        with:
          name: desktop-windows-installer-inputs
          path: app/build/windows
      - uses: ./.github/actions/install-nsis
      - name: Build the installer with the signed application
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          WINDOWS_SIGNING: ${{ needs.prepare.outputs.windows_signing }}
        run: |
          $accepted = @('Valid')
          if ($env:WINDOWS_SIGNING -eq 'signpath-test') { $accepted += 'UnknownError', 'NotTrusted' }
          $app = Join-Path $env:GITHUB_WORKSPACE "signed-app\CARE Clinic.exe"
          $uninstaller = Join-Path $env:GITHUB_WORKSPACE "signed-app\uninstall.exe"
          foreach ($file in @($app, $uninstaller)) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -notin $accepted -or -not $signature.SignerCertificate) { throw "$file signature is $($signature.Status): $($signature.StatusMessage)" }
            "$file signed by $($signature.SignerCertificate.Subject)"
          }
          git diff --exit-code -- app/build/windows/installer/project.nsi
          if ($LASTEXITCODE -ne 0) { throw "Installer inputs do not match the checked-out project.nsi" }
          New-Item -ItemType Directory -Force app/build/bin, installer | Out-Null
          Push-Location app/build/windows/installer
          makensis "-DARG_WAILS_AMD64_BINARY=$app" "-DSIGNED_UNINSTALLER=$uninstaller" project.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Pop-Location
          $built = Get-ChildItem app/build/bin/*installer.exe
          if ($built.Count -ne 1) { throw "Expected one installer, found $($built.Count)" }
          $info = $built.VersionInfo
          if ($info.ProductName -ne 'CARE Clinic' -or $info.CompanyName -ne 'Open Healthcare Network Foundation' -or $info.ProductVersion -ne $env:VERSION) {
            throw "Installer metadata: product='$($info.ProductName)' company='$($info.CompanyName)' version='$($info.ProductVersion)'"
          }
          Copy-Item $built.FullName "installer/CARE-Clinic-$env:VERSION-windows-amd64-setup.exe"
      - id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-windows-installer
          path: installer/
          if-no-files-found: error
          retention-days: 7

  sign-windows-installer:
    name: Sign Windows installer
    needs: [prepare, windows-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit to SignPath and wait for approval
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.windows-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.prepare.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: signed-installer
      - run: test -s "signed-installer/CARE-Clinic-${{ needs.prepare.outputs.version }}-windows-amd64-setup.exe"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-windows-installer-signed
          path: signed-installer/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package installers
    needs: [prepare, checks, sign-windows-installer]
    # Unsigned packaging is allowed only when signing was never configured;
    # a failed or timed-out signing request fails the release.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.checks.result == 'success'
      && (needs.prepare.outputs.sign_windows == 'true' && needs.sign-windows-installer.result == 'success'
          || needs.prepare.outputs.sign_windows != 'true' && needs.sign-windows-installer.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ENGINE_TAG: ${{ needs.prepare.outputs.engine_tag }}
      SIGN_MACOS: ${{ secrets.MACOS_CERT_P12 != '' }}
      SIGN_WINDOWS: ${{ needs.prepare.outputs.sign_windows }}
      WINDOWS_SIGNING: ${{ needs.prepare.outputs.windows_signing }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: desktop-macos-unsigned
          path: incoming/macos
      - uses: actions/download-artifact@v8.0.1
        if: env.SIGN_WINDOWS == 'true'
        with:
          name: desktop-windows-installer-signed
          path: incoming/windows
      - uses: actions/download-artifact@v8.0.1
        if: env.SIGN_WINDOWS != 'true'
        with:
          name: desktop-windows-unsigned
          path: incoming/windows
      - name: Import macOS signing certificate
        if: env.SIGN_MACOS == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw=$(uuidgen)
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pw" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package the CI-built applications
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p incoming/app release-assets staging
          ditto -x -k incoming/macos/desktop-macos-unsigned.zip incoming/app
          apps=(incoming/app/*.app)
          test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
          app=${apps[0]}
          service="$app/Contents/MacOS/care-clinic-service"
          entitlements=app/cmd/care-clinic-service/care-clinic-service.entitlements
          test -x "$service"
          engine="care-engine-${ENGINE_TAG#engine-v}-arm64.tar.gz"
          test -s "$app/Contents/Resources/engine/$engine"
          (cd "$app/Contents/Resources/engine" && shasum -a 256 -c SHA256SUMS)
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$actual" = "$VERSION"
          codesign --verify --strict "$app"
          if [ "$SIGN_MACOS" = "true" ]; then
            : "${SIGN_IDENTITY:?Missing MACOS_SIGN_IDENTITY}"
            : "${NOTARY_KEY:?Missing APPSTORE_PRIVATE_KEY}"
            : "${NOTARY_KEY_ID:?Missing APPSTORE_KEY_ID}"
            : "${NOTARY_ISSUER:?Missing APPSTORE_ISSUER_ID}"
            notary_key="$RUNNER_TEMP/notary.p8"
            (umask 077; printf '%s' "$NOTARY_KEY" > "$notary_key")
            notary=(--key "$notary_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
            field() { python3 -c 'import sys,json; print(json.load(sys.stdin)["'"$1"'"])'; }
            notarize() {
              local id status
              id=$(xcrun notarytool submit "$1" "${notary[@]}" \
                --no-wait --output-format json | field id)
              [ -n "$id" ] || { echo "::error::No notarization submission ID"; exit 1; }
              echo "submitted $1 -> $id"
              for attempt in 1 2 3 4 5 6; do
                xcrun notarytool wait "$id" "${notary[@]}" --timeout 2h && break
                echo "::warning::Notarization poll $attempt failed; retrying."
              done
              status=$(xcrun notarytool info "$id" "${notary[@]}" \
                --output-format json | field status)
              if [ "$status" != "Accepted" ]; then
                echo "::error::Notarization status: $status"
                xcrun notarytool log "$id" "${notary[@]}"
                exit 1
              fi
            }
            codesign --force --timestamp --options runtime \
              --entitlements "$entitlements" \
              --keychain "$SIGNING_KEYCHAIN" --sign "$SIGN_IDENTITY" \
              "$service"
            codesign --force --timestamp --options runtime \
              --keychain "$SIGNING_KEYCHAIN" --sign "$SIGN_IDENTITY" "$app"
            codesign --verify --strict "$app"
            ditto -c -k --keepParent "$app" incoming/notarize.zip
            notarize incoming/notarize.zip
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
          else
            echo "::warning::MACOS_CERT_P12 is not set; the macOS app is ad-hoc signed and not notarized, so Gatekeeper will block it until it is allowed in System Settings."
            codesign --force --sign - --entitlements "$entitlements" "$service"
            codesign --force --sign - "$app"
            codesign --verify --strict "$app"
          fi
          codesign -d --entitlements - --xml "$service" 2>/dev/null | grep -q com.apple.security.virtualization || {
            echo "::error::care-clinic-service lost its virtualization entitlement"
            exit 1
          }
          ditto "$app" "staging/CARE Clinic.app"
          ln -s /Applications staging/Applications
          dmg="release-assets/CARE-Clinic-$VERSION-macos.dmg"
          hdiutil create -volname "CARE Clinic" -srcfolder staging -ov -format UDZO \
            "$dmg"
          if [ "$SIGN_MACOS" = "true" ]; then
            codesign --force --timestamp \
              --keychain "$SIGNING_KEYCHAIN" --sign "$SIGN_IDENTITY" "$dmg"
            notarize "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
          fi
          installers=(incoming/windows/*.exe)
          test "${#installers[@]}" -eq 1 && test -s "${installers[0]}"
          cp "${installers[0]}" "release-assets/CARE-Clinic-$VERSION-windows-amd64-setup.exe"
          cp versions.yml release-assets/versions.yml
      - name: Remove macOS signing credentials
        if: always() && env.SIGN_MACOS == 'true'
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
      - name: Record build identity and checksums
        run: |
          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const hash = path => crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
          const manifest = {
            version: process.env.VERSION,
            source_commit: process.env.GITHUB_SHA,
            engine: process.env.ENGINE_TAG.replace(/^engine-v/, ""),
            versions_sha256: hash("release-assets/versions.yml"),
            signing: {
              macos: process.env.SIGN_MACOS === "true" ? "developer-id-notarized" : "ad-hoc",
              windows: process.env.WINDOWS_SIGNING,
            },
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          fs.writeFileSync("release-assets/release-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          const files = fs.readdirSync("release-assets").sort();
          fs.writeFileSync("release-assets/SHA256SUMS",
            files.map(file => `${hash("release-assets/" + file)}  ${file}\n`).join(""));
          NODE
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: care-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft release
    needs: [prepare, package]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ENGINE_TAG: ${{ needs.prepare.outputs.engine_tag }}
      WINDOWS_SIGNING: ${{ needs.prepare.outputs.windows_signing }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: care-release-assets
          path: release-assets
      - name: Verify complete asset set
        working-directory: release-assets
        run: |
          test -s "CARE-Clinic-$VERSION-macos.dmg"
          test -s "CARE-Clinic-$VERSION-windows-amd64-setup.exe"
          test -s versions.yml
          test -s release-manifest.json
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum --check --strict SHA256SUMS
      - name: Create tag and draft without replacing published versions
        run: |
          tag="desktop-v$VERSION"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")
          if [ -n "$existing" ]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already points to another commit. Use a new version."
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          case "$WINDOWS_SIGNING" in
            signpath-foundation)
              windows_note="- Windows: signed with a certificate issued to SignPath Foundation (free code signing provided by SignPath.io)." ;;
            signpath-test)
              windows_note="- Windows: **Test build: do not publish.** Signed with SignPath's untrusted test certificate." ;;
            unsigned)
              windows_note="- Windows: **UNSIGNED.** SmartScreen will warn before the installer runs (More info, then Run anyway)." ;;
            *)
              echo "::error::Unknown Windows signing status '$WINDOWS_SIGNING'"
              exit 1 ;;
          esac
          macos=$(jq -r .signing.macos release-assets/release-manifest.json)
          case "$macos" in
            developer-id-notarized)
              macos_note="- macOS: signed with Developer ID and notarized." ;;
            ad-hoc)
              macos_note="- macOS: **UNSIGNED** (ad-hoc signature, not notarized). Gatekeeper blocks the first launch; allow it in System Settings, Privacy & Security (Open Anyway)." ;;
            *)
              echo "::error::Unknown macOS signing status '$macos'"
              exit 1 ;;
          esac
          cat > release-notes.md <<EOF
          ## CARE Clinic $VERSION

          **Preview release.**

          ### Signing

          $macos_note
          $windows_note

          See release-manifest.json for each platform's signing status.

          - Source commit: $GITHUB_SHA
          - Bundled engine: ${ENGINE_TAG} (macOS)
          - Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Release pins: versions.yml
          - Build identity: release-manifest.json
          - File integrity: SHA256SUMS (not a publisher signature)

          ### Verify your download

          A damaged download is rejected on its own: the Windows installer checks itself
          before it runs and asks for a new copy, and macOS will not open a damaged disk
          image. To check a file by hand, compare its SHA-256 with its line in SHA256SUMS:

              Windows (PowerShell): Get-FileHash CARE-Clinic-$VERSION-windows-amd64-setup.exe
              macOS (Terminal):     shasum -a 256 CARE-Clinic-$VERSION-macos.dmg

          If they differ, delete the file and download it again.

          Before publishing, review the installers, test on a disposable clinic,
          and add upgrade notes and known limitations.
          Take a verified backup before upgrading an existing clinic.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --prerelease --title "CARE Clinic $VERSION (preview)" \
            --notes-file release-notes.md release-assets/*
