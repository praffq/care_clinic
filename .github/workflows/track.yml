name: Track CARE refs

# Keeps the update feed on the latest commits of the refs in versions.yml
# (care.backend, care.frontend and plugins). Hourly, it resolves each ref to
# a commit and compares them with the sources recorded in the newest CARE
# release of the published feed. When anything moved, it builds the images
# (images.yml, which smoke-tests the backend with every plugin) and publishes
# a new signed feed revision (publish.yml); clinics then apply it through
# their update coordinator. See docs/ci-publishing.md.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      refs:
        description: "Ref overrides, space-separated NAME=REF (NAME: backend, frontend or a plugin id)"
        type: string
        default: ""
      force:
        description: Build and publish even when nothing changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: track-care-refs
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Compare upstream refs with the feed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      sources: ${{ steps.compare.outputs.sources }}
    steps:
      - name: Require the signing key
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          if [ -z "$FEED_SIGNING_KEY" ]; then
            echo "::error title=FEED_SIGNING_KEY is not set::Tracking publishes signed feed revisions and cannot run without the key. Create it with 'go run ./cmd/release keygen --out feed.key' (in app/) and 'gh secret set FEED_SIGNING_KEY -R $GITHUB_REPOSITORY < feed.key'. See docs/ci-publishing.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve refs and compare with the published feed
        id: compare
        env:
          REFS: ${{ inputs.refs || '' }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          args=()
          for r in $REFS; do args+=(--ref "$r"); done
          scripts/dev-images.sh --print-sources ${args[@]+"${args[@]}"} >resolved.json
          echo "sources=$(jq -c . resolved.json)" >>"$GITHUB_OUTPUT"

          feed_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/updates.json"
          status=$(curl -sS -o feed.json -w '%{http_code}' "$feed_url")
          case "$status" in
            200) jq -S '[.care[] | select(.sources != null)] | sort_by(.released_at) | last | .sources // {}' feed.json >published.json ;;
            404) echo '{}' >published.json ;;
            *) echo "::error::GET $feed_url returned $status"; exit 1 ;;
          esac

          changed=false
          if [ "$FORCE" = true ]; then
            changed=true
            echo "Forced rebuild."
          elif ! jq -S . resolved.json | cmp -s - published.json; then
            changed=true
            echo "Upstream moved:"
            diff <(jq -S . published.json) <(jq -S . resolved.json) || true
          else
            echo "The feed already has these commits."
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          {
            echo "### Tracked sources (changed: $changed)"
            echo
            echo "| Name | Ref | Resolved | Published |"
            echo "| --- | --- | --- | --- |"
            jq -r --slurpfile p published.json '
              ($p[0]) as $p |
              (({backend, frontend} | to_entries[]) | [.key, .value, ($p[.key].rev // "")]),
              ((.plugins | to_entries[]) | [.key, .value, ($p.plugins[.key].rev // "")])
              | "| \(.[0]) | \(.[1].ref) | `\(.[1].rev[0:12])` | `\(.[2][0:12])` |"' resolved.json
          } >>"$GITHUB_STEP_SUMMARY"

  images:
    name: Build images
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      sources: ${{ needs.check.outputs.sources }}

  publish:
    name: Publish feed
    needs: images
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      images_run_id: ${{ github.run_id }}
      care: true
      engine: false
    secrets:
      FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
