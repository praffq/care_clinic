# Release pins for CARE Clinic. See docs/versions.md.
schema: 1

desktop:
  version: "0.2.0"
  requires: { engine: ">=0.1.0 <0.2.0" }

engine:
  version: "0.1.3"
  requires: { desktop: ">=0.2.0" }

care:
  version: "3.1.0"
  requires: { desktop: ">=0.2.0", engine: ">=0.1.0" }
  backend: { repo: "ohcnetwork/care", ref: "ENG-737" }
  frontend: { repo: "ohcnetwork/care_fe", ref: "bodhi/questionnaire-actions" }

images:
  postgres: "postgres:17.10-alpine"
  redis: "redis:8.8.0-alpine"
  caddy: "caddy:2.11.4"
  silo: "docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z"
  node: "node:22.23.3-bookworm-slim"
  nginx: "nginx:1.30.6-alpine"

# Curated plugins built into every release. CI resolves each ref to a commit
# and records it in the image labels and the feed. Backend plugins are
# pip-installed into the backend image (enabled at runtime by
# ADDITIONAL_PLUGS); frontend plugins are module-federation remotes baked
# into care-frontend at /plugins/<id>/. Plugin repos must be public.
plugins:
  care_onboarding_fe: { repo: "ohcnetwork/care_onboarding_fe", ref: "main", kind: "frontend" }
  care_multihost_files_be: { repo: "ohcnetwork/care_multihost_files_be", ref: "main", kind: "backend" }
  # develop, as in the ohcnetwork/care_clinic catalog: main does not build with current setuptools.
  care_filly: { repo: "ohcnetwork/care_filly", ref: "develop", kind: "backend" }

tools:
  qemu_windows_x86_64:
    version: "10.1.0"
    url: "https://qemu.weilnetz.de/w64/2025/qemu-w64-setup-20250826.exe"
    sha256: "c7592db7716029e814d71c9a7dfc9b76dc72019753ee9afc2fa70b14c9d28b4f"
