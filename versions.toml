# The only human-edited release file. Everything CARE Clinic pins for a
# release lives here; the build stages it into the embedded .env (see
# app/cmd/stageconfig) and CI resolves it into the signed release manifest.
schema = 1

[desktop]
version = "0.1.19"
requires_engine = ">=0.1.2, <0.2.0"
updates_url = "https://praffq.github.io/care_clinic/updates.json"

[engine]
version = "0.1.2"
requires_desktop = ">=0.1.15"

[care]
version = "3.1.0"
requires_desktop = ">=0.1.15"
requires_engine = ">=0.1.2"

[care.backend]
repo = "praffq/care"
branch = "ENG-737"

[care.frontend]
repo = "praffq/care_fe"
branch = "bodhi/questionnaire-actions"

[support_images]
postgres = "postgres:17.10-alpine"
redis = "redis:8.8.0-alpine"
caddy = "caddy:2.11.4"
silo = "docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z"

[caddy]
coraza = "v2.6.1"

